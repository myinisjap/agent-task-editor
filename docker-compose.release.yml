# Deploy Agent Task Editor from prebuilt images instead of building from source.
#
#   ATE_VERSION=v1.2.3 docker compose -f docker-compose.release.yml up -d
#
# Or use ./run.sh, which injects the required env vars for you (repo mount,
# GitHub token, Claude auth) and defaults ATE_VERSION to "latest".
#
# The backend image also ships an "-all-cli" variant with the Codex and Qwen
# CLIs preinstalled (see backend/Dockerfile's INSTALL_*_CLI build
# args). Select it by setting ATE_CLI_SUFFIX=-all-cli (run.sh does this for
# you via --all-cli).
#
# The container remaps its runtime user to PUID/PGID at startup, so files agents
# write to bind-mounted repos are owned by your host user. run.sh sets these from
# `id -u`/`id -g`; they default to 1000:1000.
services:
  backend:
    image: ghcr.io/myinisjap/agent-task-editor-backend:${ATE_VERSION:-latest}${ATE_CLI_SUFFIX:-}
    pull_policy: always
    # Bound to loopback by default: API_TOKEN ships commented out, so a
    # 0.0.0.0 binding would expose the board and the agent-dispatch path to
    # the whole LAN. Set ATE_BIND_ADDR=0.0.0.0 (and set API_TOKEN!) to expose
    # it deliberately; see the Security section in the README.
    ports:
      - "${ATE_BIND_ADDR:-127.0.0.1}:8080:8080"
    # Lets the container reach services published on the host (e.g. a separate
    # local-model container). Use host.docker.internal as the hostname.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      # /readyz (not /healthz) so Docker actually detects a wedged backend —
      # it checks DB connectivity and dispatch-loop liveness, not just that
      # the HTTP server is up. See docs/api.md.
      # curl, not wget: the bookworm-slim backend image ships curl (wget was a
      # busybox built-in on the old alpine base and no longer exists).
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Default memory ceiling for the backend service — see docs/getting-started.md.
    # Raise this if you run many concurrent agent runs.
    deploy:
      resources:
        limits:
          memory: 4g
    environment:
      - PORT=8080
      - DB_PATH=/data/agent-task-editor.db
      - CORS_ORIGINS=http://localhost:5173
      # Run agents as your host user so files they write to bind-mounted repos
      # are owned by you, not root. run.sh sets these from `id -u`/`id -g`.
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      # Path to the MCP sidecar binary built into the image
      - MCP_SERVER_PATH=/app/mcp-server
      # Path to the board MCP binary; enables the create-task tools in chat sessions
      - MCP_BOARD_PATH=/app/mcp-board
      # Optional: set API_TOKEN to require a Bearer token on all API requests
      # - API_TOKEN=change-me
      # Optional: use provider=anthropic in agent configs to call the API directly
      # instead of the CLI (different billing — pay-per-token vs Claude Max)
      # - LLM_API_KEY=sk-ant-...
      # Local model via a separate container (OpenAI-compatible API, e.g. llama.cpp
      # server). host.docker.internal reaches ports the model publishes on the host.
      - LLM_BASE_URL=${LLM_BASE_URL:-http://host.docker.internal:8081/v1}
      # Optional: GitHub token as a fallback if ~/.config/gh isn't mounted.
      # gh CLI picks this up automatically; set it here to enable PR state sync
      # without mounting the gh config directory.
      - GITHUB_TOKEN=${GH_TOKEN:-}
      # Optional: self-hosted Gitea support. GITEA_HOST is what enables it at
      # all — comma-separated host(s) whose git remotes should be handled by the
      # Gitea forge (e.g. git.example.com,gitea.internal:3000). GITEA_TOKEN is a
      # PAT with repo read/write scope; GITEA_BASE_URL optionally overrides the
      # API base URL (defaults to https://<first GITEA_HOST>).
      # See docs/task-sources.md.
      - GITEA_HOST=${GITEA_HOST:-}
      - GITEA_TOKEN=${GITEA_TOKEN:-}
      - GITEA_BASE_URL=${GITEA_BASE_URL:-}
      # SSL bypass — active when INSECURE_SKIP_SSL_VERIFY=true. These vars are
      # pre-computed by run.sh so that setting INSECURE_SKIP_SSL_VERIFY=false
      # never accidentally disables SSL (compose's :+ expansion fires on any
      # non-empty value).
      - GIT_SSL_NO_VERIFY=${GIT_SSL_NO_VERIFY:-}
      - NPM_CONFIG_STRICT_SSL=${NPM_CONFIG_STRICT_SSL:-}
      - NODE_TLS_REJECT_UNAUTHORIZED=${NODE_TLS_REJECT_UNAUTHORIZED:-}
      # Alternative to the bypass above: trust a specific corporate CA cert
      # instead of disabling verification entirely. Set SSL_CA_CERT_PATH to a
      # host .pem file (see volumes below); active only when it's non-empty.
      - GIT_SSL_CAINFO=${SSL_CA_CERT_PATH:+/etc/ssl/custom-ca.pem}
      - NODE_EXTRA_CA_CERTS=${SSL_CA_CERT_PATH:+/etc/ssl/custom-ca.pem}
      - SSL_CERT_FILE=${SSL_CA_CERT_PATH:+/etc/ssl/custom-ca.pem}
      # Set to the host directory containing your repos. The backend rewrites
      # paths under this directory to /repos inside the container automatically.
      - REPO_BASE_DIR=${REPO_BASE_DIR:-/tmp/repos}
      # Optional: write rotated local snapshots to /data/backups every BACKUP_INTERVAL,
      # keeping the newest BACKUP_KEEP. /data is the db_data volume, so this persists
      # with no new volume needed. See docs/backup.md.
      # - BACKUP_DIR=/data/backups
      # - BACKUP_INTERVAL=24h
      # - BACKUP_KEEP=7
    volumes:
      - db_data:/data
      # Per-repo agent toolchains via mise/uv (see docs/runtime.md). Named
      # volumes rather than a bind mount since these are content/version-
      # addressed caches shared across all repos, not per-repo state.
      - mise-data:/home/node/.local/share/mise
      - uv-cache:/home/node/.cache/uv
      # Claude Max auth — run 'claude login' on your host machine first,
      # then this mount shares that session with the container.
      - ${HOME}/.claude:/home/node/.claude
      - ${HOME}/.claude.json:/home/node/.claude.json
      # GitHub CLI auth — run 'gh auth login' on your host machine first,
      # then this mount shares that credential with the container.
      # The :ro flag makes it read-only (the container never writes new auth).
      - ${HOME}/.config/gh:/home/node/.config/gh:ro
      # Custom CA cert (see SSL_CA_CERT_PATH above). Falls back to /dev/null
      # (always present, mounts as an empty file) so the mount never errors
      # when the var is unset — GIT_SSL_CAINFO etc. are only wired up when set.
      - ${SSL_CA_CERT_PATH:-/dev/null}:/etc/ssl/custom-ca.pem:ro
      # Repos directory — mounted at the same path so host paths work as-is.
      - ${REPO_BASE_DIR:-/tmp/repos}:${REPO_BASE_DIR:-/tmp/repos}

  frontend:
    image: ghcr.io/myinisjap/agent-task-editor-frontend:${ATE_VERSION:-latest}
    pull_policy: always
    ports:
      - "${ATE_BIND_ADDR:-127.0.0.1}:5173:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: on-failure

volumes:
  db_data:
  mise-data:
  uv-cache:
