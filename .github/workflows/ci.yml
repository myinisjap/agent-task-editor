name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: every job only checks out code and builds/tests it; nothing
# here comments on PRs, uploads SARIF, or pushes packages. Grant extra scopes
# per-job (never here) if that changes.
permissions:
  contents: read

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      CGO_ENABLED: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: '1.27.3'
          cache-dependency-path: backend/go.sum
      - run: go mod download
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a  # v9.3.0
        with:
          version: v2.14.0
          working-directory: backend
      - run: go build ./...

      # Fails if internal/storage/gen/ (sqlc-generated code) doesn't match
      # internal/storage/queries/*.sql + migrations/*.up.sql. Pinned to the
      # exact sqlc version that produced the currently-committed gen/ output,
      # so this only trips on real drift, not tool-version noise.
      - name: Install sqlc
        run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
      - name: Check sqlc codegen drift
        run: |
          sqlc generate
          git diff --exit-code -- internal/storage/gen

      - name: go test (with coverage)
        run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

      # Two things are filtered out of the coverage profile before computing
      # the total, because they'd distort the metric rather than reflect real
      # test gaps:
      #   - internal/storage/gen/ is sqlc-generated (`// Code generated by
      #     sqlc. DO NOT EDIT.`) and is never hand-written or meaningfully
      #     unit-tested; it's exercised only indirectly via the packages that
      #     use it. Do NOT hand-edit files under gen/ to "improve" this number
      #     — regenerate via `sqlc generate` if the schema/queries change.
      #   - cmd/server is main()'s config/DB/HTTP wiring and graceful-shutdown
      #     glue — process wiring, not unit-testable logic, same as the other
      #     cmd/* entry points.
      - name: Filter generated/non-testable code from coverage profile
        run: grep -vE '/internal/storage/gen/|/cmd/server/' coverage.out > coverage.filtered.out
      - name: Coverage summary
        if: always()
        run: go tool cover -func=coverage.filtered.out | tail -1 >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: backend-coverage
          path: backend/coverage.out

      # Coverage floor: fails the build if total statement coverage drops
      # below this so it can't silently erode PR-by-PR. Measured against
      # coverage.filtered.out, which excludes internal/storage/gen/ and
      # cmd/server (see above) so generated code and process wiring don't
      # distort the metric. Set a couple points below the coverage measured
      # when this gate was last raised (~78% with -race/atomic mode after
      # those exclusions, which has some run-to-run jitter) rather than
      # exactly at it, so normal variance doesn't flake unrelated PRs. Bump
      # this floor upward over time as coverage genuinely improves — don't
      # lower it to make a failing PR pass.
      - name: Enforce coverage floor
        run: |
          pct=$(go tool cover -func=coverage.filtered.out | tail -1 | grep -oE '[0-9]+\.[0-9]+')
          floor=76.0
          echo "backend total coverage (excluding internal/storage/gen/): ${pct}% (floor: ${floor}%)"
          awk -v pct="$pct" -v floor="$floor" 'BEGIN { exit !(pct+0 >= floor+0) }' \
            || { echo "::error::backend coverage ${pct}% is below the ${floor}% floor"; exit 1; }

      # The stdlib CVEs (crypto/tls, crypto/x509, net/http, os, ...) that
      # previously kept this step non-blocking were fixed in Go 1.25.8+. The
      # toolchain that runs here — the setup-go step above and the Dockerfile
      # builder — is now Go 1.27, so govulncheck analyzes against a patched
      # stdlib and this step is blocking again. (The go.mod `go 1.25.0`
      # directive stays as the language floor; it does not affect the stdlib
      # version govulncheck sees, which comes from the running toolchain.)
      # Pinned so a new govulncheck release can't fail unrelated PRs; bump
      # deliberately. Dependabot's gomod ecosystem does not track `go
      # install` lines, so this is a manual bump.
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
      - name: govulncheck
        run: govulncheck ./...

  frontend:
    name: Frontend (Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type check
        run: npx tsc -b
      - run: npm run build
      - run: npm run lint

      # Fails if src/api/types.ts (generated by openapi-typescript from the
      # root openapi.yaml) doesn't match the committed spec, so the API spec
      # and the generated client types can't silently diverge.
      - name: Check generated API types are up to date
        run: |
          npm run gen:api
          git diff --exit-code -- src/api/types.ts

      # Fails if docs/agents.md's Capability Matrix (generated by
      # scripts/gen-capability-docs.mjs from
      # frontend/src/lib/providerCapabilities.ts — the source of truth the UI
      # also reads) is stale. Mirrors the sqlc/api-types drift gates.
      - name: Check generated capability matrix is up to date
        run: |
          npm run gen:capability-docs
          git diff --exit-code -- ../docs/agents.md

      - name: Test with coverage
        run: npm run test:coverage
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: frontend-coverage
          path: frontend/coverage

      # Coverage floor (statements), mirroring the backend gate. vitest's
      # 'json-summary' reporter (configured in vite.config.ts) emits
      # coverage/coverage-summary.json with a machine-readable "total" block.
      # coverage.all + include in vite.config.ts force every src/**/*.{ts,tsx}
      # file into the report (not just files a test happens to import), so
      # this floor can actually detect a newly-added, entirely-untested file
      # dragging the percentage down. Set a few points below the coverage
      # measured right after that change (~47.98% statements) to leave
      # headroom for run-to-run variance.
      - name: Enforce coverage floor
        run: |
          node -e '
            const s = require("./coverage/coverage-summary.json").total.statements.pct;
            const floor = 44.0;
            console.log(`frontend statement coverage: ${s}% (floor: ${floor}%)`);
            if (s < floor) {
              console.error(`::error::frontend coverage ${s}% is below the ${floor}% floor`);
              process.exit(1);
            }
          '

  docker-build:
    name: Docker build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # Verifies both Dockerfiles still build. The backend image's final
      # stage doubles as the agents' execution toolchain, not just a
      # deployment artifact, so a broken build here is a functional
      # regression, not just a packaging one. Build-only (no `up`) so no
      # .env file is needed — every env var in docker-compose.yml has a
      # ${VAR:-default} fallback.
      - name: docker compose build
        run: docker compose build

  e2e:
    name: E2E smoke tests (Playwright)
    runs-on: ubuntu-latest
    # Independent of the frontend/backend/docker-build jobs so a slow or
    # flaky E2E run never gates the fast unit-test feedback loop above.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      # The demo repo dir must exist on the runner's filesystem *before*
      # `docker compose up`, since REPO_BASE_DIR is bind-mounted host-dir ->
      # same container path — the backend container needs to see this
      # directory already populated when it starts.
      - name: Seed demo repo directory
        run: |
          mkdir -p /tmp/repos/demo-repo
          git -C /tmp/repos/demo-repo init -q
          git -C /tmp/repos/demo-repo -c user.name=demo -c user.email=demo@example.com \
            commit -q --allow-empty -m "Initial commit"

      # No .env file needed — every var in docker-compose.yml has a
      # ${VAR:-default} fallback, and these smoke tests never trigger a
      # real agent run, so no LLM/GitHub credentials are required either.
      - name: Start stack
        run: docker compose up -d --build --wait
      - name: Run Playwright E2E suite
        run: npm run e2e
        working-directory: frontend
      - name: docker compose logs
        if: always()
        run: docker compose logs
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: playwright-report
          path: frontend/playwright-report
      - name: Tear down stack
        if: always()
        run: docker compose down -v
